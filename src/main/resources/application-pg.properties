spring.datasource.url=jdbc:postgresql://localhost:5432/tasks_test_db_pg
spring.datasource.username=your_test_pg_user
spring.datasource.password=your_test_pg_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=5m
spring.cache.redis.cache-null-values=false

logging.level.root=INFO
logging.level.TGJavaProjects.TasksApplication=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce.core=DEBUG
# logging.level.org.flywaydb=DEBUG

